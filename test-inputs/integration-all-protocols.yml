proxies:
  - name: integration-vmess
    type: vmess
    server: vmess.example.com
    port: 443
    uuid: "11111111-1111-1111-1111-111111111111"
    cipher: auto
    tls: true
    sni: vmess.example.com
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: edge.vmess.example.com

  - name: integration-ss
    type: ss
    server: ss.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "ss-password"

  - name: integration-trojan
    type: trojan
    server: trojan.example.com
    port: 443
    password: "trojan-password"
    tls: true
    servername: trojan.example.com
    network: ws
    ws-opts:
      path: /trojan
      headers:
        Host: edge.trojan.example.com

  - name: integration-vless
    type: vless
    server: vless.example.com
    port: 443
    uuid: "22222222-2222-2222-2222-222222222222"
    flow: xtls-rprx-vision
    tls: true
    servername: vless.example.com
    client-fingerprint: chrome

  - name: integration-anytls
    type: anytls
    server: anytls.example.com
    port: 443
    password: "anytls-password"
    servername: anytls.example.com
    skip-cert-verify: true
    idle_session_check_interval: 60s
    idle_session_timeout: 120s
    min_idle_session: 2
