name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module `
              -Name powershell-yaml `
              -RequiredVersion '0.4.12' `
              -Repository PSGallery `
              -Scope CurrentUser `
              -Force `
              -AllowClobber

          Install-Module `
              -Name Pester `
              -RequiredVersion '5.7.1' `
              -Repository PSGallery `
              -Scope CurrentUser `
              -Force `
              -AllowClobber

          Import-Module Pester -RequiredVersion '5.7.1' -Force

      - name: Validate module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = Join-Path $PWD 'ClashToSingBox.psd1'
          Test-ModuleManifest -Path $manifestPath | Out-Null
          Import-Module $manifestPath -Force

          $expectedCommands = @('Convert-ProxyNodes')
          $actualCommands = @(
              Get-Command -Module ClashToSingBox |
                  Select-Object -ExpandProperty Name |
                  Sort-Object
          )

          $commandDifference = @(
              Compare-Object `
                  -ReferenceObject $expectedCommands `
                  -DifferenceObject $actualCommands
          )

          if ($commandDifference.Count -gt 0) {
              throw "Unexpected module exports: $($actualCommands -join ', ')"
          }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module Pester -RequiredVersion '5.7.1' -Force

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'

          Invoke-Pester -Configuration $configuration

      - name: Run conversion smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
              throw 'RUNNER_TEMP is not available.'
          }

          $manifestPath = Join-Path $PWD 'ClashToSingBox.psd1'
          $inputPath = Join-Path $PWD 'test-inputs/integration-all-protocols.yml'
          $outputPath = Join-Path $env:RUNNER_TEMP 'ci3-outbounds.json'

          Import-Module $manifestPath -Force
          $result = Convert-ProxyNodes -InputFile $inputPath -OutputFile $outputPath

          if (-not $result.Success) {
              throw "Conversion failed: $($result.Errors -join '; ')"
          }

          if (
              $result.SuccessCount -ne 5 -or
              $result.FailedCount -ne 0 -or
              $result.FilteredCount -ne 0
          ) {
              throw (
                  'Unexpected conversion counts: ' +
                  "success=$($result.SuccessCount), " +
                  "failed=$($result.FailedCount), " +
                  "filtered=$($result.FilteredCount)"
              )
          }

          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
              throw "Conversion did not create the output file: $outputPath"
          }

          $outbounds = @(
              Get-Content -LiteralPath $outputPath -Raw -Encoding UTF8 |
                  ConvertFrom-Json -ErrorAction Stop
          )

          if ($outbounds.Count -ne 5) {
              throw "Expected 5 outbounds, found $($outbounds.Count)."
          }

          $requiredFields = @('type', 'tag', 'server', 'server_port')

          foreach ($outbound in $outbounds) {
              foreach ($field in $requiredFields) {
                  if ($outbound.PSObject.Properties.Name -notcontains $field) {
                      throw "Outbound is missing required field '$field'."
                  }

                  if ([string]::IsNullOrWhiteSpace([string]$outbound.$field)) {
                      throw "Outbound field '$field' is empty."
                  }
              }

              $serverPort = [int]$outbound.server_port
              if ($serverPort -lt 1 -or $serverPort -gt 65535) {
                  throw "Outbound has invalid server_port: $serverPort"
              }
          }

      - name: Check repository cleanliness
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $gitArguments = @(
              'status'
              '--porcelain=v1'
              '--untracked-files=all'
          )
          $workingTreeStatus = @(& git @gitArguments)

          if ($LASTEXITCODE -ne 0) {
              throw "git status failed with exit code $LASTEXITCODE."
          }

          if ($workingTreeStatus.Count -gt 0) {
              $workingTreeStatus | ForEach-Object { Write-Error $_ }
              throw 'CI commands modified or created files in the repository.'
          }

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module `
              -Name PSScriptAnalyzer `
              -RequiredVersion '1.24.0' `
              -Repository PSGallery `
              -Scope CurrentUser `
              -Force `
              -AllowClobber

          Import-Module PSScriptAnalyzer -RequiredVersion '1.24.0' -Force

      - name: Run static analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module PSScriptAnalyzer -RequiredVersion '1.24.0' -Force

          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $analysis = @(
              Invoke-ScriptAnalyzer `
                  -Path $PWD `
                  -Recurse `
                  -Settings $settingsPath
          )

          $analysis | Format-Table -AutoSize

          if ($analysis.Count -gt 0) {
              throw "PSScriptAnalyzer reported $($analysis.Count) blocking finding(s)."
          }
