name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  package:
    name: Package module
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and package
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module -Name powershell-yaml -RequiredVersion '0.4.12' -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          $manifestPath = Join-Path $PWD 'ClashToSingBox.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath
          $manifestVersion = $manifest.Version.ToString()
          $isTagBuild = '${{ github.event_name }}' -eq 'push'

          if ($isTagBuild) {
              $tag = '${{ github.ref_name }}'
              if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
                  throw "Release tag must match vMAJOR.MINOR.PATCH: $tag"
              }
              $tagVersion = $Matches[1]
              if ($tagVersion -ne $manifestVersion) {
                  throw "Tag version $tagVersion does not match module version $manifestVersion."
              }
              $version = $tagVersion
          }
          else {
              $version = $manifestVersion
          }

          $stagingRoot = Join-Path $env:RUNNER_TEMP 'module-staging'
          $moduleRoot = Join-Path $stagingRoot 'ClashToSingBox'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'module-package'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'module-extracted'
          New-Item -Path $moduleRoot, $packageRoot, $extractRoot -ItemType Directory -Force | Out-Null

          $files = @('ClashToSingBox.psd1', 'ClashToSingBox.psm1', 'LICENSE', 'README.md')
          foreach ($file in $files) {
              Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination (Join-Path $moduleRoot $file)
          }
          foreach ($directory in @('Classes', 'Private', 'Public')) {
              Copy-Item -LiteralPath (Join-Path $PWD $directory) -Destination (Join-Path $moduleRoot $directory) -Recurse
          }

          $requiredFiles = @(
              'ClashToSingBox.psd1',
              'ClashToSingBox.psm1',
              'LICENSE',
              'README.md',
              'Classes/ProxyNode.ps1',
              'Private/Converter.ps1',
              'Private/Validator.ps1',
              'Public/Convert-ProxyNodes.ps1'
          )
          foreach ($file in $requiredFiles) {
              if (-not (Test-Path -LiteralPath (Join-Path $moduleRoot $file) -PathType Leaf)) {
                  throw "Package is missing required file: $file"
              }
          }

          $packagePath = Join-Path $packageRoot "ClashToSingBox-$version.zip"
          Compress-Archive -Path $moduleRoot -DestinationPath $packagePath -CompressionLevel Optimal -Force
          Expand-Archive -LiteralPath $packagePath -DestinationPath $extractRoot -Force

          $extractedModule = Join-Path $extractRoot 'ClashToSingBox'
          Test-ModuleManifest -Path (Join-Path $extractedModule 'ClashToSingBox.psd1') | Out-Null
          Import-Module (Join-Path $extractedModule 'ClashToSingBox.psd1') -Force
          $commands = @(Get-Command -Module ClashToSingBox | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject @('Convert-ProxyNodes') -DifferenceObject $commands).Count -gt 0) {
              throw "Unexpected package exports: $($commands -join ', ')"
          }

          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$packagePath.sha256"
          "$hash  $(Split-Path -Leaf $packagePath)" | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM
          $recordedHash = (Get-Content -LiteralPath $checksumPath -Raw).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          if ($recordedHash -ne $hash) {
              throw 'SHA256 file does not match the package.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=ClashToSingBox-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashToSingBox-${{ steps.metadata.outputs.version }}
          path: ${{ runner.temp }}/module-package/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify package checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $env:RUNNER_TEMP "release-assets/ClashToSingBox-${{ needs.package.outputs.version }}.zip"
          $checksumPath = "$packagePath.sha256"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Package artifact is missing: $packagePath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw "Checksum artifact is missing: $checksumPath"
          }
          $expected = (Get-Content -LiteralPath $checksumPath -Raw).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
              throw "Checksum mismatch: expected $expected, actual $actual"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release already exists for tag $tag."
          }
          $packagePath = Join-Path $env:RUNNER_TEMP "release-assets/ClashToSingBox-${{ needs.package.outputs.version }}.zip"
          $checksumPath = "$packagePath.sha256"
          & gh release create $tag $packagePath $checksumPath --verify-tag --title "ClashToSingBox ${{ needs.package.outputs.version }}" --generate-notes
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }
